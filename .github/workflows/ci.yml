name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create CI env files
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/dex_terminal
          NEXT_PUBLIC_CHAIN_ID=11155111
          NEXT_PUBLIC_RPC_URL=https://ethereum-sepolia-rpc.publicnode.com
          NEXT_PUBLIC_API_URL=http://localhost:4000
          NEXT_PUBLIC_WS_URL=http://localhost:4000
          EOF
          cp .env .ENV

      - name: Generate Prisma client
        run: pnpm --filter @dex-terminal/api db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dex_terminal

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dex_terminal

      - name: Tests
        run: |
          pnpm --filter @dex-terminal/api test
          pnpm --filter @dex-terminal/indexer test
          pnpm --filter @dex-terminal/web test
          pnpm --filter @dex-terminal/contracts test

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dex_terminal
